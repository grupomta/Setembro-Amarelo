  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

argin:0\">Acolhimento e tratamento na prevenção ao suicídio<\u002Fh3>\n            <p style=\"font-size:14.5px;color:#786A56;margin:10px 0 0;max-width:52ch\">Um episódio sobre saúde mental no dia a dia: como perceber sinais de sofrimento, acolher quem precisa e os caminhos de tratamento disponíveis.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;position:relative;z-index:1\">\n          <span style=\"font-size:12.5px;font-weight:600;color:#8E5F13;background:#FBE4A6;border-radius:999px;padding:6px 13px\">Como acolher sem julgar<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#8E5F13;background:#FBE4A6;border-radius:999px;padding:6px 13px\">Sinais de alerta<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#8E5F13;background:#FBE4A6;border-radius:999px;padding:6px 13px\">Caminhos de tratamento<\u002Fspan>\n        <\u002Fdiv>\n        <audio controls=\"controls\" preload=\"none\" src=\"podcast-acolhimento.mp3\" style=\"width:100%;height:44px;accent-color:#EBA92B;position:relative;z-index:1\">\n          Seu navegador não suporta áudio. <a href=\"podcast-acolhimento.mp3\" style=\"color:#8E5F13\">Baixar o episódio<\u002Fa>.\n        <\u002Faudio>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"ajuda\" style=\"padding:66px 24px;background:#F6E8C2;scroll-margin-top:130px\">\n    <div style=\"max-width:1000px;margin:0 auto\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <div style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#8E5F13;margin-bottom:13px\"><span style=\"width:24px;height:2px;background:#EBA92B;border-radius:2px;display:inline-block\"><\u002Fspan>Onde buscar ajuda psicológica<\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0;font-size:clamp(28px,4.6vw,44px)\">Atendimento psicológico gratuito<\u002Fh2>\n      <p style=\"color:#786A56;max-width:58ch;margin:14px 0 0\">Macapá e Santana. Toque em qualquer unidade para abrir a localização no mapa.<\u002Fp>\n\n      <div style=\"margin-top:34px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px\">\n          <sc-for list=\"{{tabsList}}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{t.onClick}}\" style=\"{{t.style}}\">{{t.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{scheduleText}}\">\n          <div style=\"font-size:14px;color:#786A56;background:#FFFBEF;border:1px solid #ECD79A;border-left:4px solid #EBA92B;border-radius:10px;padding:12px 15px;margin-bottom:14px\"><b style=\"color:#2A2016\">{{scheduleText}}<\u002Fb><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{!isSantana}}\">\n          <p style=\"font-size:13px;color:#786A56;margin:0 0 13px;padding-left:2px;font-weight:500\">{{count}}<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"{{collapsedStyle}}\">\n          <sc-if value=\"{{!isSantana}}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px\">\n              <sc-for list=\"{{items}}\" as=\"u\" hint-placeholder-count=\"6\">\n                <a href=\"{{u.href}}\" target=\"_blank\" rel=\"noopener\" style=\"background:#FFFBEF;border:1px solid #ECD79A;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:3px;text-decoration:none;transition:.15s\" style-hover=\"border-color:#8E5F13;transform:translateY(-2px);box-shadow:0 1px 2px rgba(42,32,22,.05),0 14px 34px -24px rgba(42,32,22,.4)\">\n                  <span style=\"font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#2A2016\">{{u.n}}<sc-if value=\"{{u.  telefone, todos os dias, a qualquer hora.<\u002Fp>\n        <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px\">\n          <a href=\"tel:188\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:11px;font-size:16px;background:#EBA92B;color:#241B12;box-shadow:0 14px 30px -14px rgba(235,169,43,.75)\">Ligar 188<\u002Fa>\n          <a href=\"https://cvv.org.br\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:11px;font-size:16px;background:transparent;color:#FBF3DC;border:1.5px solid rgba(251,243,220,.4)\">Chat e e-mail no site<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:66px 24px;background:linear-gradient(155deg,#F5DE96,#EFCB68);position:relative;overflow:hidden\">\n    <div style=\"position:absolute;left:-6%;top:8%;width:min(340px,60vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 62%)\"><\u002Fdiv>\n    <div style=\"position:absolute;right:-6%;top:26%;width:min(340px,60vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 62%)\"><\u002Fdiv>\n    <div style=\"position:absolute;right:-8%;bottom:-10%;width:min(380px,68vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(196,130,26,.22),transparent 62%)\"><\u002Fdiv>\n    <sc-for list=\"{{shareFlowers}}\" as=\"f\" hint-placeholder-count=\"6\">\n      <div class=\"sf-deco\" style=\"{{f.wrap}}\" aria-hidden=\"true\">\n        <span style=\"{{f.p0}}\"><\u002Fspan><span style=\"{{f.p1}}\"><\u002Fspan><span style=\"{{f.p2}}\"><\u002Fspan><span style=\"{{f.p3}}\"><\u002Fspan><span style=\"{{f.p4}}\"><\u002Fspan><span style=\"{{f.center}}\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"max-width:1000px;margin:0 auto;position:relative;z-index:1\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#8E5F13;margin-bottom:13px\"><span style=\"width:24px;height:2px;background:#EBA92B;border-radius:2px;display:inline-block\"><\u002Fspan>Compartilhe<\u002Fdiv>\n      <h2 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0;font-size:clamp(28px,4.6vw,44px)\">Leve o pronto atendimento no bolso<\u002Fh2>\n      <p style=\"color:#786A56;max-width:58ch;margin:14px 0 0\">Aponte a câmera do celular para o QR Code e tenha o acolhimento à mão a qualquer momento.<\u002Fp>\n      <div id=\"qrbox\" style=\"container-type:inline-size;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:34px;background:#FFFBEF;border:1px solid #ECD79A;border-radius:18px;padding:28px;box-shadow:0 1px 2px rgba(42,32,22,.05),0 14px 34px -24px rgba(42,32,22,.4)\">\n        <div style=\"flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto\">\n          <div id=\"qrcode-mount\" style=\"width:174px;height:174px;padding:12px;background:#fff;border-radius:14px;border:1px solid #ECD79A;display:flex;align-items:center;justify-content:center\"><\u002Fdiv>\n          <span style=\"font-size:12.5px;color:#786A56\">Abre <b style=\"color:#2A2016\">cvv.org.br<\u002Fb> · apoio 24h<\u002Fspan>\n        <\u002Fdiv>\n        <div id=\"qr-text\" style=\"flex:1;min-width:240px;text-align:left\">\n          <h3 style=\"font-size:20px;margin:0 0 6px;color:#2A2016\">Acesso rápido ao CVV<\u002Fh3>\n          <p style=\"color:#786A56;font-size:14.5px;margin:0\">Aponte a câmera do celular e o QR já abre a central de ajuda do CVV: telefone, chat e e-mail, disponível a qualquer hora do dia.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{showBrands}}\">\n    <section style=\"background:#FBF3DC;border-top:1px solid #ECD79A;padding:50px 24px\">\n      <div style=\"max-width:1000px;margin:0 auto\">\n        <p style=\"text-align:center;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#786A56;margin:0 0 28px\">Uma iniciativa do Grupo Monte MTA<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:30px 46px\">\n          <img src=\"6038cb1d-4ace-4c99-a611-f2a5e98b113f\" alt=\"MTA\" style=\"height:38px;width:auto;object-fit:contain\">\n          <img src=\"72699a9b-5e88-4b7f-8557-8c489e9e1e8b\" alt=\"Grupo Monte\" style=\"height:58px;width:auto;object-fit:contain\">\n          <img src=\"6b68bff9-bcd2-4342-881a-0f503f96415b\" alt=\"Tropical\" style=\"height:52px;width:auto;object-fit:contain\">\n          <img src=\"09293dc3-c220-4a16-8de9-77196975fbdb\" alt=\"Posto\" style=\"height:34px;width:auto;object-fit:contain\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#241B12;color:rgba(251,243,220,.66);text-align:center;padding:46px 20px\">\n    <span style=\"font-size:30px;line-height:1;margin:0 auto 14px;display:block;text-align:center\">🎗️<\u002Fspan>\n    <p style=\"margin:5px 0;font-size:14px\"><b style=\"color:#FBF3DC\">Setembro Amarelo<\u002Fb> · Grupo Monte MTA · Recursos Humanos<\u002Fp>\n    <p style=\"margin:5px 0;font-size:14px\">Cuidar de você é cuidar da nossa equipe. Em caso de emergência, ligue 188.<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;macapa&quot;,&quot;options&quot;:[&quot;macapa&quot;,&quot;emergencia&quot;,&quot;santana&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Comportamento&quot;},&quot;showBrands&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamento&quot;}}\">\n\nclass Component extends DCLogic {\n  cuidadoCards = [\n    {path:\"M20 14.5A8 8 0 1 1 9.5 4a6.2 6.2 0 0 0 10.5 10.5Z\", title:\"Durma o suficiente\", desc:\"Dormir bem recarrega o corpo e a mente. Vale buscar uma rotina de sono mais tranquila.\"},\n    {path:\"M3 12h4l2.5-7 4 14 2.5-7H21\", title:\"Mova o corpo\", desc:\"Qualquer atividade física ajuda: caminhar, dançar, pedalar, se alongar. O movimento alivia a tensão e clareia a mente.\"},\n    {path:\"M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.2A7.5 7.5 0 1 1 20 11.5Z\", title:\"Fale com alguém\", desc:\"Dividir o que você sente com uma pessoa de confiança alivia o peso. Você não precisa enfrentar tudo em silêncio.\"},\n    {path:\"M3 8h10a2.6 2.6 0 1 0-2.6-2.6M3 12h13.5a2.6 2.6 0 1 1-2.6 2.6M3 16h8\", title:\"Pausas conscientes\", desc:\"Respire fundo algumas vezes ao longo do dia. Estar presente no agora acalma o corpo e a mente.\"},\n    {path:\"M12 3.5l7 2.6v4.9c0 4.3-2.9 7.2-7 8.5-4.1-1.3-7-4.2-7-8.5V6.1l7-2.6Z\", path2:\"M9.3 12l2 2 3.4-3.6\", title:\"Respeite seus limites\", desc:\"Reservar um tempo longe do trabalho e das telas não é preguiça, é uma forma de cuidar de você.\"},\n    {path:\"M12 20.3S3.8 15.2 3.8 9.5A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 8.2 2.5c0 5.7-8.2 10.8-8.2 10.8Z\", title:\"Busque apoio profissional\", desc:\"Procurar um psicólogo ou um serviço de saúde é um passo de cuidado, não um sinal de fraqueza.\"}\n  ];\n  sinais = [\n    \"Isolamento repentino de amigos, família ou colegas\",\n    \"Falas de desânimo profundo, culpa ou \\\"sem saída\\\"\",\n    \"Mudanças no sono, no apetite ou no humor\",\n    \"Perda de interesse pelo que antes gostava\",\n    \"Descuido consigo ou frases de despedida\"\n  ];\n  acolherList = [\n    \"Escute com atenção, paciência, Jhonatan Bezerra, 1495, Infraero I\"},\n    {n:\"UBS Infraero II\", a:\"Av. Carlos Lins Cortes, 161, Infraero II\"},\n    {n:\"UBS São Pedro\", a:\"Rua Jovino Dinoá, 3985, Beirol\"},\n    {n:\"UBS Brasil Novo\", a:\"Av. Abacatal, 177, Brasil Novo\"}\n  ];\n  emergencia = [\n    {n:\"UBS Rubim Aronovitch\", a:\"Av. Seis de Setembro, Santa Inês\", h:\"Seg a sex, 7h às 13h\"},\n    {n:\"UBS Marcelo Cândia\", a:\"Rua Ver. Júlio Maria Pinto Pereira, 1329, Jardim Felicidade\", h:\"Seg a sex, 7h às 13h\"},\n    {n:\"UBS Marabaixo\", a:\"Av. 4, s/n, Marabaixo 2\", h:\"Seg a sex, 7h às 19h\"}\n  ];\n  santanaCaps = [\n    {n:\"CAPS AD de Santana\", a:\"Av. Lucena de Azevedo, 499 · Vila Daniel\", meta:\"Adultos (18+) · álcool e outras drogas\"},\n    {n:\"CAPSi · Espaço JAPIIM\", a:\"Rua Adalvaro Alves Cavalcante, 941 · Central\", meta:\"Crianças e adolescentes (6–17 anos)\"}\n  ];\n  santanaUbs = [\n    {n:\"UBS Dr. Iacy Alcântara\", a:\"Rua Damião da Cruz Barreto, s/n · Fonte Nova\"},\n    {n:\"UBS Antônio Serieiro\", a:\"Av. Maria Colares, 796 · Nova Brasília\"},\n    {n:\"UBS Floriano Rego\", a:\"Rua Cláudio Lúcio Monteiro, 476 · Comercial\"},\n    {n:\"UBS Igarapé da Fortaleza\", a:\"Rodovia Salvador Diniz, 2450 · Igarapé da Fortaleza\"},\n    {n:\"UBS Parque das Laranjeiras\", a:\"Rua das Orquídeas, 264 · Parque das Laranjeiras\"},\n    {n:\"UBS Picarreira\", a:\"Ramal do Delta, s/n · Picarreira\"},\n    {n:\"Policlínica Maria Tadeu Aguiar\", a:\"Av. Juscelino Kubitschek, 529 · Paraíso\"},\n    {n:\"Policlínica Dr. Alberto Lima\", a:\"Travessa Moura de Carvalho, 30 · Daniel\"},\n    {n:\"UBS da Família Elesbão\", a:\"Ramal da Olaria, s/n · Elesbão\", meta:\"comunidade ribeirinha\"},\n    {n:\"Posto de Saúde Igarapé do Lago\", a:\"Rua Rita Macedo, s/n · Igarapé do Lago\", meta:\"zona rural\"},\n    {n:\"Posto de Saúde Anauerapucu\", a:\"Rodovia AP-010, s/n · Vila Anauerapucu\", meta:\"zona rural\"},\n    {n:\"UBS Ilha de Santana\", a:\"Ilha de Santana\", meta:\"comunidade ribeirinha · confirmar local\"}\n  ];\n\n  state = { tab: this.props.defaultTab || \"macapa\", moreOpen: false, activeSection: \"cuidado\" };\n\n  makeFlower(side, offset, top, size, opacity){\n    const petalH = Math.round(size * 0.44);\n    const petalW = Math.round(petalH * 0.619);\n    const center = Math.round(size * 0.26);\n    const petal = (rot) => `position:absolute;top:50%;left:50%;width:${petalW}px;height:${petalH}px;background:#EBA92B;border-radius:50%;transform:translate(-50%,-100%) rotate(${rot}deg);transform-origin:50% 100%`;\n    return {\n      wrap: `position:absolute;${side}:${offset}px;top:${top}px;width:${size}px;height:${size}px;opacity:${opacity}`,\n      p0: petal(0), p1: petal(72), p2: petal(144), p3: petal(216), p4: petal(288),\n      center: `position:absolute;top:50%;left:50%;width:${center}px;height:${center}px;background:#5E4319;border-radius:50%;transform:translate(-50%,-50%)`\n    };\n  }\n  setTab(key){ this.setState({ tab: key, moreOpen: false }); }\n  toggleMore(){ this.setState(s => ({ moreOpen: !s.moreOpen })); }\n  mapsMacapa(a){ return \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(a + \", Macapá, AP\"); }\n  mapsSantana(n, a){ return \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(n + \" \" + a + \", Santana, AP\"); }\n\n  componentDidMount(){\n    const ids = [\"cuidado\",\"acolher\",\"video\",\"ajuda\",\"cvv\"];\n    const els = ids.map(id => document.getElementById(id)).filter(Boolean);\n    this._observer = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) this.setState({ activeSection: e.target.id }); });\n    }, { rootMargin: \"-45% 0px -50% 0px\", threshold: 0 });\n    els.forEach(el => this._observer.observe(el));\n\n    const initQR = () => {\n      const mount = document.getElementById(\"qrcode-mount\");\n      if (this._qrDone || !mount) return;\n      if (window.QRCode) {\n        this._qrDone = true;\n        new window.QRCode(mount, { text: \"https://cvv.org.br\", width: 160, height: 160, colorDark: \"#2A2016\", colorLight: \"#ffffff\" });\n      } else {\n        setTimeout(initQR, 200);\n      }\n    };\n    initQR();\n  }\n  componentWillUnmount(){ if (this._observer) this._observer.disconnect(); }\n\n  componentDidUpdate(){\n    if (this._lastActiveSection === this.state.activeSection) return;\n    this._lastActiveSection = this.state.activeSection;\n    const nav = document.getElementById(\"navchips\");\n    const chip = document.getElementById(\"navchip-\" + this.state.activeSection);\n    if (!nav || !chip) return;\n    const target = chip.offsetLeft - (nav.clientWidth - chip.offsetWidth) / 2;\n    nav.scrollTo({ left: Math.max(0, Math.min(target, nav.scrollWidth - nav.clientWidth)), behavior: \"smooth\" });\n  }\n\n  renderVals(){\n    const s = this.state;\n    const navDefs = [\n      { id: \"cuidado\", label: \"Autocuidado\" },\n      { id: \"acolher\", label: \"Acolher\" },\n      { id: \"video\", label: \"Vídeo e Podcast\" },\n      { id: \"ajuda\", label: \"Ajuda psicológica\" },\n      { id: \"cvv\", label: \"CVV 188\" }\n    ];\n    const navItems = navDefs.map(n => ({\n      ...n,\n      hrefAnchor: \"#\" + n.id,\n      chipId: \"navchip-\" + n.id,\n      style: s.activeSection === n.id\n        ? \"flex:none;text-decoration:none;font-size:13.5px;font-weight:600;color:#2A2016;background:#FBE4A6;border:1px solid #2A2016;padding:9px 16px;border-radius:9px;white-space:nowrap\"\n        : \"flex:none;text-decoration:none;font-size:13.5px;font-weight:600;color:#786A56;background:#FFFBEF;border:1px solid #ECD79A;padding:9px 16px;border-radius:9px;white-space:nowrap\"\n    }));\n\n    const isSantana = s.tab === \"santana\";\n    const rawItems = s.tab === \"emergencia\" ? this.emergencia : this.ubsMacapa;\n    const items = !isSantana ? rawItems.map(u => ({ ...u, href: this.mapsMacapa(u.a) })) : [];\n    const shouldCollapse = s.tab !== \"emergencia\";\n    const collapsedStyle = shouldCollapse && !s.moreOpen\n      ? \"position:relative;max-height:440px;overflow:hidden\"\n      : \"position:relative\";\n    const showFade = shouldCollapse && !s.moreOpen;\n    const fadeStyle = \"position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(rgba(246,232,194,0),#F6E8C2);pointer-events:none\";\n\n    const scheduleText = isSantana ? null : (s.tab === \"emergencia\"\n      ? \"Atendimento de emergência: confira o horário de cada unidade abaixo.\"\n      : \"Horário geral das UBS: segunda a sexta, das 8h às 17h.\");\n\n    const santanaCaps = this.santanaCaps.map(u => ({ ...u, href: this.mapsSantana(u.n, u.a) }));\n    const santanaUbs = this.santanaUbs.map(u => ({ ...u, href: this.mapsSantana(u.n, u.a) }));\n\n    const tabsList = [\n      { key: \"macapa\", label: \"Macapá\" },\n      { key: \"emergencia\", label: \"Emergência\" },\n      { key: \"santana\", label: \"Santana\" }\n    ].map(t => ({\n      ...t,\n      style: s.tab === t.key\n        ? \"flex:none;border:1.5px solid #2A2016;background:#2A2016;color:#FBF3DC;padding:12px 20px;border-radius:10px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap\"\n        : \"flex:none;border:1.5px solid #ECD79A;background:#FFFBEF;color:#786A56;padding:12px 20px;border-radius:10px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap\",\n      onClick: () => this.setTab(t.key)\n    }));\n\n    const leftFlowers = [\n      this.makeFlower(\"left\", 56, 150, 46, .68),\n      this.makeFlower(\"left\", 32, 260, 30, .55),\n      this.makeFlower(\"left\", 66, 340, 22, .5),\n      this.makeFlower(\"left\", 40, 430, 38, .58),\n      this.makeFlower(\"left\", 62, 520, 18, .45),\n      this.makeFlower(\"left\", 34, 600, 26, .5),\n      this.makeFlower(\"left\", 56, 680, 16, .4)\n    ];\n    const rightFlowers = [\n      this.makeFlower(\"right\", 46, 190, 40, .62),\n      this.makeFlower(\"right\", 70, 280, 22, .48),\n      this.makeFlower(\"right\", 30, 350, 30, .55),\n      this.makeFlower(\"right\", 60, 440, 18, .45),\n      this.makeFlower(\"right\", 40, 520, 34, .58),\n      this.makeFlower(\"right\", 66, 600, 20, .45),\n      this.makeFlower(\"right\", 44, 670, 15, .4)\n    ];\n\n    const videoFlowers = [\n      this.makeFlower(\"left\", 40, 30, 36, .55),\n      this.makeFlower(\"left\", 10, 130, 20, .45),\n      this.makeFlower(\"left\", 60, 220, 26, .5),\n      this.makeFlower(\"right\", 50, 20, 32, .5),\n      this.makeFlower(\"right\", 20, 110, 22, .45),\n      this.makeFlower(\"right\", 70, 200, 18, .4)\n    ];\n\n    const shareFlowers = [\n      this.makeFlower(\"left\", 30, 26, 34, .5),\n      this.makeFlower(\"left\", 60, 120, 20, .42),\n      this.makeFlower(\"left\", 8, 210, 16, .38),\n      this.makeFlower(\"left\", 40, 300, 26, .45),\n      this.makeFlower(\"left\", 70, 380, 18, .4),\n      this.makeFlower(\"left\", 14, 40, 14, .35),\n      this.makeFlower(\"right\", 44, 32, 30, .48),\n      this.makeFlower(\"right\", 14, 130, 22, .42),\n      this.makeFlower(\"right\", 76, 190, 18, .4),\n      this.makeFlower(\"right\", 30, 260, 28, .46),\n      this.makeFlower(\"right\", 60, 340, 16, .38),\n      this.makeFlower(\"right\", 10, 380, 20, .4)\n    ];\n\n    return {\n      shareFlowers,\n      videoFlowers,\n      leftFlowers,\n      rightFlowers,\n      navItems,\n      cuidadoCards: this.cuidadoCards,\n      sinais: this.sinais,\n      acolherList: this.acolherList,\n      tabsList,\n      isSantana,\n      items,\n      count: items.length + \" unidades\",\n      scheduleText,\n      collapsedStyle,\n      showFade,\n      fadeStyle,\n      showMoreBtn: shouldCollapse,\n      moreLabel: s.moreOpen ? \"Ver menos\" : \"Ver todas as unidades\",\n      chevStyle: \"fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;transform:\" + (s.moreOpen ? \"rotate(180deg)\" : \"none\"),\n      toggleMore: () => this.toggleMore(),\n      santanaCaps,\n      santanaUbs,\n      showBrands: this.props.showBrands !== false\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
